# Harness Farm registry: YOUR integrations. It starts blank (no demo data).
# Add MCP servers, AI accounts and OpenAPI providers from the Console (Integrations -> Add integration) or the
# CLI (`farm mcp add`, `farm ai add`, `farm provider remove`). The Farm keeps this file in step with the
# database, so `farm registry export` and `farm registry sync` round-trip. A full sample: registry.example.yaml.
#
# Secrets never live here: auth_ref is env:NAME (a variable in the owner's .env), token-store:ID or cli:PROFILE.

settings:
  owner_email: milvow.ai@gmail.com
  alert_thresholds: [50, 80, 100]

providers: {}

# The product-level capabilities every Farm has; their routes fill in as AI accounts are added.
# (MCP pass-through capabilities `mcp:<provider>` are created per MCP server and are not listed here.)
capabilities:
  ask_ai:
    kind: ai
    description: Ask another AI (Claude, Gemini, Codex or Hermes) to do a task and return its answer.
    routes: []
    strategy: failover
    cache_ttl_seconds: 0

  agent_task:
    kind: ai
    description: Run an agentic AI CLI job (Claude Code, Codex, Gemini/agy, Hermes) with tools.
    routes: []
    strategy: failover
    cache_ttl_seconds: 0

budgets:
  global_monthly_usd: 0
  hard_stop: true
  per_provider: {}
  per_connection: {}
