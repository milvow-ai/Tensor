[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-farm"
version = "0.0.1"
description = "Harness Farm"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==4.0.10",
    "mcp==2.3.0",
    "dbos==3.2.0",
    "crawl4ai==0.9.4",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "aiolimiter==1.3.0",
    "pybreaker==1.4.1",
    "psycopg[binary]==3.3.6",
    "structlog==26.1.0",
    "tldextract==5.3.2",
    "rapidfuzz==3.14.6",
    "typer==0.27.2",
    "pyyaml>=6",
    "alembic>=1.14",
    "playwright>=1.50",
]

[project.scripts]
farm = "farm.control.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx==0.23.1",
    "vcrpy==8.3.0",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["farm"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["farm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
