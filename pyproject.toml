[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-farm"
version = "0.0.1"
description = "Harness Farm"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==4.0.10",
    "mcp==2.3.0",
    "dbos==3.2.0",
    "crawl4ai==0.9.4",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "aiolimiter==1.3.0",
    "pybreaker==1.4.1",
    "psycopg[binary]==3.3.6",
    "psycopg-pool>=3.2",
    "pgserver>=0.1.4",
    "psutil>=5.9",
    "structlog==26.1.0",
    "tldextract==5.3.2",
    "rapidfuzz==3.14.6",
    "typer==0.27.2",
    "pyyaml>=6",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "playwright>=1.50",
    "jsonschema>=4.23",
]

[project.scripts]
farm = "farm.control.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-socket>=0.7",
    "respx==0.23.1",
    "vcrpy==8.3.0",
    "ruff",
    "mypy",
    "types-PyYAML",
    "types-psutil",
]

[tool.hatch.build.targets.wheel]
packages = ["farm"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"farm/db/migrations/**" = ["E501"]  # raw SQL blocks
"tests/**" = ["E501"]  # inline SQL strings

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["farm"]

[[tool.mypy.overrides]]
# pgserver ships no type information (its command wrappers are created at import time).
module = ["pgserver", "pgserver.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--disable-socket --allow-hosts=127.0.0.1,localhost,::1"
