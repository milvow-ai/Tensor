# Small, fully valid registry for tests (DB sync, ledger, router). Not the real one: config/registry.yaml.
# Two accounts in the reoon pool so failover / most_remaining / round_robin have something to choose between.
settings:
  owner_email: owner@example.com
  alert_thresholds: [50, 80, 100]

providers:
  reoon:
    name: Reoon
    kind: tool
    executor: api
    default_strategy: failover
    connections:
      - id: reoon-01
        auth_ref: env:REOON_API_KEY
        priority: 1
        units:
          credits: {limit: 20, period: day, charged_on: success}
      - id: reoon-02
        auth_ref: env:REOON_API_KEY_2
        priority: 2
        units:
          credits: {limit: 20, period: day, charged_on: success}

  zerobounce:
    name: ZeroBounce
    kind: tool
    executor: api
    connections:
      - id: zerobounce-01
        auth_ref: env:ZEROBOUNCE_API_KEY
        units:
          credits: {limit: 100, period: month, anchor: 1, charged_on: success}

  clay:
    name: Clay
    kind: tool
    executor: mcp
    default_strategy: sticky
    connections:
      - id: clay-01
        auth_ref: "token-store:clay-01"
        concurrency: 2
        priority: 1
        plan: {name: launch, price_usd: 185, billing_day: 14}
        units:
          credits: {limit: 2500, period: month, anchor: 14, charged_on: success, unit_cost_usd: 0.074}
          actions: {limit: 15000, period: month, anchor: 14}
      - id: clay-02
        auth_ref: "token-store:clay-02"
        status: needs_login
        priority: 2
        units:
          credits: {limit: null}

  claude:
    name: Claude
    kind: ai
    executor: cli_agent
    connections:
      - id: claude-02
        auth_ref: "cli:claude-02"
        meta: {cli: claude, config_dir: "D:/farm-data/ai/claude-02", models: [sonnet, opus, haiku]}
        units:
          requests: {limit: 5, period: rolling_5h}

capabilities:
  verify_email:
    kind: tool
    description: Verify that an email address exists and can receive mail.
    routes: [reoon, zerobounce]
    strategy: failover
    cache_ttl_seconds: 5184000
  ask_ai:
    kind: ai
    description: Ask another AI to do a task.
    routes: [claude]
    cache_ttl_seconds: 0

budgets:
  global_monthly_usd: 50
  per_provider: {clay: 0, reoon: 0}
